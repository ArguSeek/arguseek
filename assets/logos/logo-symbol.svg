<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#gradient)" opacity="0.1"/>

  <!-- Magnifying glass handle -->
  <path
    d="M 65 65 L 80 80"
    stroke="url(#gradient)"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Main circle of magnifying glass -->
  <circle
    cx="45"
    cy="45"
    r="25"
    stroke="url(#gradient)"
    stroke-width="6"
    fill="none"
  />

  <!-- Three dots inside representing multiple sources -->
  <circle cx="35" cy="40" r="3" fill="#14B8A6"/>
  <circle cx="45" cy="45" r="3" fill="#14B8A6"/>
  <circle cx="55" cy="50" r="3" fill="#14B8A6"/>
</svg>
